name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  MAVEN_OPTS: -Xmx1536m -Djava.awt.headless=true

jobs:
  verify:
    name: Verify (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Maven verify (tests, Checkstyle, SpotBugs, JaCoCo)
        run: ./mvnw -B -ntp -Pci verify

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/spotbugsXml.xml
            target/bom.*
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: face-recognition:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name fr -p 8080:8080 face-recognition:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/liveness; then exit 0; fi
            sleep 2
          done
          docker logs fr
          exit 1

  release:
    name: Release
    needs: [verify, docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Package release jars
        run: ./mvnw -B -ntp -DskipTests package

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            target/face-recognition-*.jar
            target/bom.json
            target/bom.xml
          generate_release_notes: true
