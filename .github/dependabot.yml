version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
          - "tools.jackson*"
      test-tooling:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"
          - "com.github.spotbugs:*"
          - "org.cyclonedx:*"
          - "org.codehaus.mojo:*"
          - "com.puppycrawl.tools:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Java base images move only to the next LTS, by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
